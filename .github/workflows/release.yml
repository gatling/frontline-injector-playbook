name: Release
run-name: >-
  Release (cloud: ${{ inputs.cloud }}, arch: ${{ inputs.arch }}, variant: ${{ inputs.variante }},
  latest: ${{ inputs.latest }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud
        type: choice
        options: [all, aws, gcp, azure]
        default: all
      arch:
        description: Architecture
        type: choice
        options: [all, x86, arm]
        default: all
      variante:
        description: Variant (see images.yml)
        type: choice
        options: [all, java-latest, java-lts, graal-latest, graal-browser-latest]
        default: all
      latest:
        description: "Latest: only the variants whose JDK is latest (true) or not (false)"
        type: choice
        options: [all, "true", "false"]
        default: all
      dry_run:
        description: Dry run (list the selected images, build nothing)
        type: boolean
        default: false
      image_version:
        description: Azure image version (x.y.z), computed when empty
        type: string
        required: false

permissions:
  contents: read

# one run at a time: a second run waits for the first one
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Select the images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      aws: ${{ steps.plan.outputs.aws }}
      gcp: ${{ steps.plan.outputs.gcp }}
      azure: ${{ steps.plan.outputs.azure }}
      packer: ${{ steps.plan.outputs.packer }}
      aws_max_parallel: ${{ steps.plan.outputs.aws_max_parallel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the images from images.yml
        id: plan
        env:
          CLOUD: ${{ inputs.cloud }}
          ARCH: ${{ inputs.arch }}
          VARIANT: ${{ inputs.variante }}
          LATEST: ${{ inputs.latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          images=$(lib/release-plan.sh images.yml "$CLOUD" "$ARCH" "$VARIANT" "$LATEST")

          # one matrix per cloud
          for cloud in aws gcp azure; do
            echo "$cloud=$(jq -c --arg cloud "$cloud" 'map(select(.cloud == $cloud))' <<<"$images")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "packer=$(yq '.tools.packer' images.yml)"
            echo "aws_max_parallel=$(yq '.clouds.aws.max_parallel' images.yml)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Selected images ($(jq 'length' <<<"$images"))"
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: nothing is built."
            fi
            echo
            echo "| Image | Script | Options |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.name) | `\(.script)` | `\(.options)` |"' <<<"$images"
          } >> "$GITHUB_STEP_SUMMARY"

  aws:
    name: AWS ${{ matrix.image.name }}
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.aws != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # current role (AWS_ROLE_SELLER), which only trusts main: no GitHub environment until the
    # trust policy accepts environment:release (OPS-714)
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: ${{ fromJSON(needs.plan.outputs.aws_max_parallel) }}
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.aws) }}
    steps:
      - name: Record the start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the Zulu templates provision with Ansible
      - name: Install `python`
        if: matrix.image.build == 'zulu'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install `ansible bundle`
        if: matrix.image.build == 'zulu'
        run: pip install ansible jmespath

      - name: Setup `packer`
        uses: hashicorp/setup-packer@c94c2f706903706acc7fe6df7960714c2321b6fc # main
        with:
          version: ${{ needs.plan.outputs.packer }}

      - name: Install `packer plugins` (versions of the template)
        env:
          TEMPLATE: ${{ matrix.image.template }}
        run: packer init "$TEMPLATE"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_SELLER }}
          aws-region: eu-west-3

      - name: Build ${{ matrix.image.name }}
        id: build
        env:
          SCRIPT: ${{ matrix.image.script }}
          OPTIONS: ${{ matrix.image.options }}
          BUILD: ${{ matrix.image.build }}
        run: |
          read -ra options <<<"$OPTIONS"
          # same fixed options as the per-image workflows: --profile only for the GraalVM builds
          options+=(--copy-regions true)
          if [ "$BUILD" != "zulu" ]; then
            options+=(--profile default)
          fi
          ./"$SCRIPT" "${options[@]}" | tee build.log

          # Packer lists the AMI of each region at the end: "eu-west-3: ami-..."
          ami=$(grep -oE 'eu-west-3: ami-[0-9a-f]+' build.log | tail -n 1 | cut -d ' ' -f 2 || true)
          echo "ami=$ami" >> "$GITHUB_OUTPUT"

      # result of this image for the Slack notification, also when the build fails
      - name: Describe the result
        if: always()
        env:
          NAME: ${{ matrix.image.name }}
          OUTCOME: ${{ steps.build.outcome }}
          AMI: ${{ steps.build.outputs.ami }}
        run: |
          result=$(jq -n --arg name "$NAME" --arg outcome "$OUTCOME" --arg ami "$AMI" \
            --argjson duration "$(( $(date +%s) - START ))" \
            '{name: $name, outcome: $outcome, ami: $ami, duration: $duration}')
          if [ -n "$AMI" ]; then
            tags=$(aws ec2 describe-images --region eu-west-3 --image-ids "$AMI" \
              --query 'Images[0].Tags' --output json || echo '[]')
            result=$(jq --argjson tags "${tags:-[]}" \
              '. + {java: ($tags | map(select(.Key == "JavaVersion"))[0].Value),
                    vendor: ($tags | map(select(.Key == "JavaVendor"))[0].Value),
                    graalvm: ($tags | map(select(.Key == "GraalVMVersion"))[0].Value)}' <<<"$result")
          fi

          # Zulu: JavaVersion is the Zulu version (25.38.201+0); the JDK version (25.0.5.1)
          # comes from the Azul API, the line keeps the Zulu version only if it does not answer
          zulu=$(jq -r 'select(.vendor == "zulu") | .java // empty' <<<"$result")
          if [ -n "$zulu" ]; then
            jdk=$(curl -fsS --max-time 20 "https://api.azul.com/metadata/v1/zulu/packages/?distro_version=${zulu%%+*}&os=linux-glibc&archive_type=tar.gz&java_package_type=jre&release_status=ga" \
              | jq -r '[.[].java_version | map(tostring) | join(".")] | unique | first // empty' || true)
            result=$(jq --arg jdk "$jdk" '. + {jdk: (if $jdk == "" then null else $jdk end)}' <<<"$result")
          fi
          echo "$result" | tee result.json

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.image.platform }}-${{ matrix.image.variant }}
          path: result.json
          retention-days: 7

  notify:
    name: Notify Slack
    needs: [plan, aws]
    # also when a build fails, but not in dry run
    if: ${{ always() && !inputs.dry_run && needs.plan.result == 'success' && needs.plan.outputs.aws != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # no result at all when every build was cancelled: the message says so
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results

      - name: Post the summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGES: ${{ needs.plan.outputs.aws }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
          FILTERS: "cloud: ${{ inputs.cloud }}, arch: ${{ inputs.arch }}, variant: ${{ inputs.variante }}, latest: ${{ inputs.latest }}"
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set: no Slack notification"
            exit 0
          fi

          # one line per selected image; an image without result did not run (cancelled)
          mkdir -p results
          results=$(find results -name result.json -exec cat {} + | jq -s '.')
          text=$(jq -r -n --argjson images "$IMAGES" --argjson results "$results" \
            --arg run "$RUN_URL" --arg actor "$ACTOR" --arg filters "$FILTERS" '
            [ $images[] | .name as $name
              | ($results | map(select(.name == $name))[0]) // {name: $name, outcome: "not run"} ] as $lines
            | ($lines | map(select(.outcome == "success")) | length) as $ok
            | (if $ok == ($lines | length) then ":white_check_mark:" else ":x:" end)
              + " Release: \($ok)/\($lines | length) AWS images published (\($filters))\n"
              + ($lines | map(
                  "• \(.name): "
                  + (if .outcome == "success"
                     then "`\(.ami)`"
                       + (if .graalvm then " · GraalVM \(.graalvm)"
                          elif .jdk then " · JDK \(.jdk) (Zulu \(.java | sub("\\+.*"; "")))"
                          elif .java then " · Zulu \(.java | sub("\\+.*"; ""))"
                          else "" end)
                       + " · \(.duration / 60 | floor) min"
                     else .outcome end)
                ) | join("\n"))
              + "\n<\($run)|Run> · launched by \($actor)"
          ')
          echo "$text"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$text" '{text: $text}')" "$SLACK_WEBHOOK_URL"
