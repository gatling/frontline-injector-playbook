name: Release
run-name: >-
  Release (cloud: ${{ inputs.cloud }}, arch: ${{ inputs.arch }}, variant: ${{ inputs.variante }},
  latest: ${{ inputs.latest }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud
        type: choice
        options: [all, aws, gcp, azure]
        default: all
      arch:
        description: Architecture
        type: choice
        options: [all, x86, arm]
        default: all
      variante:
        description: Variant (see images.yml)
        type: choice
        options: [all, java-latest, java-lts, graal-latest, graal-browser-latest]
        default: all
      latest:
        description: "Latest: only the variants whose JDK is latest (true) or not (false)"
        type: choice
        options: [all, "true", "false"]
        default: all
      dry_run:
        description: Dry run (list the selected images, build nothing)
        type: boolean
        default: false
      image_version:
        description: Azure image version (x.y.z), computed when empty
        type: string
        required: false

permissions:
  contents: read

# one run at a time: a second run waits for the first one
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Select the images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      aws: ${{ steps.plan.outputs.aws }}
      gcp: ${{ steps.plan.outputs.gcp }}
      azure: ${{ steps.plan.outputs.azure }}
      packer: ${{ steps.plan.outputs.packer }}
      aws_max_parallel: ${{ steps.plan.outputs.aws_max_parallel }}
      gcp_max_parallel: ${{ steps.plan.outputs.gcp_max_parallel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the images from images.yml
        id: plan
        env:
          CLOUD: ${{ inputs.cloud }}
          ARCH: ${{ inputs.arch }}
          VARIANT: ${{ inputs.variante }}
          LATEST: ${{ inputs.latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          images=$(lib/release-plan.sh images.yml "$CLOUD" "$ARCH" "$VARIANT" "$LATEST")

          # one matrix per cloud
          for cloud in aws gcp azure; do
            echo "$cloud=$(jq -c --arg cloud "$cloud" 'map(select(.cloud == $cloud))' <<<"$images")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "packer=$(yq '.tools.packer' images.yml)"
            echo "aws_max_parallel=$(yq '.clouds.aws.max_parallel' images.yml)"
            echo "gcp_max_parallel=$(yq '.clouds.gcp.max_parallel' images.yml)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Selected images ($(jq 'length' <<<"$images"))"
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: nothing is built."
            fi
            echo
            echo "| Image | Script | Options |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.name) | `\(.script)` | `\(.options)` |"' <<<"$images"
          } >> "$GITHUB_STEP_SUMMARY"

  aws:
    name: AWS ${{ matrix.image.name }}
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.aws != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # current role (AWS_ROLE_SELLER), which only trusts main: no GitHub environment until the
    # trust policy accepts environment:release (OPS-714)
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: ${{ fromJSON(needs.plan.outputs.aws_max_parallel) }}
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.aws) }}
    steps:
      - name: Record the start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the Zulu templates provision with Ansible
      - name: Install `python`
        if: matrix.image.build == 'zulu'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install `ansible bundle`
        if: matrix.image.build == 'zulu'
        run: pip install ansible jmespath

      - name: Setup `packer`
        uses: hashicorp/setup-packer@c94c2f706903706acc7fe6df7960714c2321b6fc # main
        with:
          version: ${{ needs.plan.outputs.packer }}

      - name: Install `packer plugins` (versions of the template)
        env:
          TEMPLATE: ${{ matrix.image.template }}
        run: packer init "$TEMPLATE"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_SELLER }}
          aws-region: eu-west-3

      - name: Build ${{ matrix.image.name }}
        id: build
        env:
          SCRIPT: ${{ matrix.image.script }}
          OPTIONS: ${{ matrix.image.options }}
          BUILD: ${{ matrix.image.build }}
        run: |
          read -ra options <<<"$OPTIONS"
          # same fixed options as the per-image workflows: --profile only for the GraalVM builds
          options+=(--copy-regions true)
          if [ "$BUILD" != "zulu" ]; then
            options+=(--profile default)
          fi
          ./"$SCRIPT" "${options[@]}" | tee build.log

          # Packer lists the AMI of each region at the end: "eu-west-3: ami-..."
          ami=$(grep -oE 'eu-west-3: ami-[0-9a-f]+' build.log | tail -n 1 | cut -d ' ' -f 2 || true)
          echo "ami=$ami" >> "$GITHUB_OUTPUT"

      # result of this image for the Slack notification, also when the build fails; versions
      # from the AMI tags (JavaVersion is the Zulu version for a Zulu image)
      - name: Describe the result
        if: always()
        env:
          NAME: ${{ matrix.image.name }}
          OUTCOME: ${{ steps.build.outcome }}
          IMAGE: ${{ steps.build.outputs.ami }}
        run: |
          if [ -n "$IMAGE" ]; then
            tags=$(aws ec2 describe-images --region eu-west-3 --image-ids "$IMAGE" \
              --query 'Images[0].Tags' --output json || echo '[]')
            tag() { jq -r --arg key "$1" 'map(select(.Key == $key))[0].Value // empty' <<<"${tags:-[]}"; }
            if [ "$(tag JavaVendor)" = "zulu" ]; then
              ZULU=$(tag JavaVersion)
              export ZULU
            fi
            GRAALVM=$(tag GraalVMVersion)
            export GRAALVM
          fi
          lib/release-result.sh

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.image.platform }}-${{ matrix.image.variant }}
          path: result.json
          retention-days: 7

  gcp:
    name: GCP ${{ matrix.image.name }}
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.gcp != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # current login: the service account key of GOOGLE_APPLICATION_CREDENTIALS; Workload
    # Identity Federation comes at the end of the project (OPS-723)
    strategy:
      max-parallel: ${{ fromJSON(needs.plan.outputs.gcp_max_parallel) }}
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.gcp) }}
    steps:
      - name: Record the start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the Zulu templates provision with Ansible
      - name: Install `python`
        if: matrix.image.build == 'zulu'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install `ansible bundle`
        if: matrix.image.build == 'zulu'
        run: pip install ansible jmespath

      - name: Setup `packer`
        uses: hashicorp/setup-packer@c94c2f706903706acc7fe6df7960714c2321b6fc # main
        with:
          version: ${{ needs.plan.outputs.packer }}

      - name: Install `packer plugins` (versions of the template)
        env:
          TEMPLATE: ${{ matrix.image.template }}
        run: packer init "$TEMPLATE"

      # key file outside the checkout, removed at the end of the job; read by Packer and by
      # the gcloud of the build script through GOOGLE_APPLICATION_CREDENTIALS
      - name: Configure GCP Credentials
        env:
          KEY: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          key_file="$RUNNER_TEMP/gcp-key.json"
          (umask 077 && printf '%s' "$KEY" > "$key_file")
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.image.name }}
        id: build
        env:
          SCRIPT: ${{ matrix.image.script }}
          OPTIONS: ${{ matrix.image.options }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        run: |
          read -ra options <<<"$OPTIONS"
          # same fixed option as the per-image workflows
          options+=(--project-id "$GOOGLE_PROJECT_ID")
          ./"$SCRIPT" "${options[@]}" | tee build.log

          # Packer names the image at the end: "A disk image was created in the '<project>' project: <name>"
          image=$(grep -oE "A disk image was created in the '[^']+' project: [a-z0-9-]+" build.log \
            | tail -n 1 | awk '{print $NF}' || true)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # result of this image for the Slack notification, also when the build fails; GCP images
      # have no labels: the version is in the description ("... OpenJDK 25.38.201-0 (022c)",
      # "... GraalVM 25.5.5.0.3 (f051)"), and the image must be shared with allAuthenticatedUsers
      - name: Describe the result
        if: always()
        env:
          NAME: ${{ matrix.image.name }}
          OUTCOME: ${{ steps.build.outcome }}
          IMAGE: ${{ steps.build.outputs.image }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        run: |
          if [ -n "$IMAGE" ]; then
            description=$(gcloud compute images describe "$IMAGE" --project "$GOOGLE_PROJECT_ID" \
              --format='value(description)' || true)
            ZULU=$(grep -oE 'OpenJDK [0-9.]+' <<<"$description" | cut -d ' ' -f 2 || true)
            GRAALVM=$(grep -oE 'GraalVM [0-9.]+' <<<"$description" | cut -d ' ' -f 2 || true)
            export ZULU GRAALVM
            shared=$(gcloud compute images get-iam-policy "$IMAGE" --project "$GOOGLE_PROJECT_ID" --format=json \
              | jq '[.bindings[]? | select(.role == "roles/compute.imageUser") | .members[]] | index("allAuthenticatedUsers") != null' || echo false)
            if [ "$shared" != "true" ]; then
              echo "::error::$IMAGE is not shared with allAuthenticatedUsers"
              export OUTCOME="not shared"
            fi
          fi
          lib/release-result.sh

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.image.platform }}-${{ matrix.image.variant }}
          path: result.json
          retention-days: 7

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"

  notify:
    name: Notify Slack
    needs: [plan, aws, gcp]
    # also when a build fails, but not in dry run
    if: ${{ always() && !inputs.dry_run && needs.plan.result == 'success' && (needs.plan.outputs.aws != '[]' || needs.plan.outputs.gcp != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # no result at all when every build was cancelled: the message says so
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results

      - name: Post the summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGES_AWS: ${{ needs.plan.outputs.aws }}
          IMAGES_GCP: ${{ needs.plan.outputs.gcp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
          FILTERS: "cloud ${{ inputs.cloud }} · arch ${{ inputs.arch }} · variant ${{ inputs.variante }} · latest ${{ inputs.latest }}"
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set: no Slack notification"
            exit 0
          fi

          # Block Kit message, like the other notifications of #ops-automation: a bold title,
          # fields, one section per image and a context line; text is the fallback of the
          # push notifications. An image without result did not run (cancelled).
          mkdir -p results
          results=$(find results -name result.json -exec cat {} + | jq -s '.')
          payload=$(jq -n --argjson aws "$IMAGES_AWS" --argjson gcp "$IMAGES_GCP" --argjson results "$results" \
            --arg run "$RUN_URL" --arg actor "$ACTOR" --arg filters "$FILTERS" '
            [ ($aws + $gcp)[] | . as $image
              | (($results | map(select(.name == $image.name))[0]) // {name: $image.name, outcome: "not run"})
              + {cloud: $image.cloud} ] as $lines
            | ($lines | length) as $total
            | ($lines | map(select(.outcome == "success")) | length) as $ok
            | ($lines | map(.cloud) | unique | map({aws: "AWS", gcp: "GCP", azure: "Azure"}[.]) | join(" and ")) as $clouds
            | (if $ok == $total
               then ":white_check_mark: *Load generator images published on \($clouds): \($ok)/\($total)*"
               else ":x: *Load generator images on \($clouds): \($ok)/\($total) published*" end) as $title
            | def version:
                if .graalvm then "GraalVM \(.graalvm)"
                elif .jdk then "JDK \(.jdk) (Zulu \(.zulu))"
                elif .zulu then "Zulu \(.zulu)"
                else empty end;
              def line:
                if .outcome == "success"
                then "*\(.name)*\n" + ([ "`\(.image)`", version, "\(.duration / 60 | floor) min" ] | join(" · "))
                else ":x: *\(.name)*\n\(.outcome)" end;
            {
              text: "\($title | gsub("\\*"; "")) · <\($run)|Open run>",
              blocks: (
                [ { type: "section", text: { type: "mrkdwn", text: $title } },
                  { type: "section", fields: [
                      { type: "mrkdwn", text: "*Filters*\n\($filters)" },
                      { type: "mrkdwn", text: "*Launched by*\n\($actor)" } ] } ]
                + ($lines | map({ type: "section", text: { type: "mrkdwn", text: line } }))
                + [ { type: "context", elements: [
                      { type: "mrkdwn", text: "<\($run)|Open run> · Release · frontline-injector-playbook" } ] } ]
              )
            }')
          jq . <<<"$payload"
          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
