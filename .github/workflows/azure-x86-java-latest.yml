name: Azure x86 java latest
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Image version (x.x.x)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install `python`
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install `ansible bundle`
        run: pip install ansible jmespath

      - name: Setup `packer`
        uses: hashicorp/setup-packer@ccebc9ff384f18f44b9866a603d149286dcafcda # main
        with:
          version: "latest"

      - name: Install `packer plugins` (versions of the template)
        run: packer init packer/azure-x86-zulu.pkr.hcl

      - name: Build image from template
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          IMAGE_VERSION: ${{ github.event.inputs.image_version }}
        run: |
          ./build-azure-x86-zulu.sh \
            --java-major 27 \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --subscription-id "$SUBSCRIPTION_ID" \
            --tenant-id "$TENANT_ID" \
            --image-version "$IMAGE_VERSION"
