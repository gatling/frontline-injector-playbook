name: Azure x86 java latest
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Image version (x.x.x)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install `python`
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install `ansible bundle`
        run: pip install ansible jmespath

      - name: Setup `packer`
        uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2 # main
        with:
          version: "latest"

      - name: Install `packer plugins - Amazon`
        run: packer plugins install github.com/hashicorp/azure

      - name: Install `packer plugins - Ansible`
        run: packer plugins install github.com/hashicorp/ansible

      - name: Build image from template
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          IMAGE_VERSION: ${{ github.event.inputs.image_version }}
        run: |
          ./build-azure-x86-zulu.sh \
            --java-major 26 \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --subscription-id "$SUBSCRIPTION_ID" \
            --tenant-id "$TENANT_ID" \
            --image-version "$IMAGE_VERSION"
