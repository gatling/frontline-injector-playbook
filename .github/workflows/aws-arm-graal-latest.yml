name: AWS arm graalvm latest
on:
  workflow_dispatch:

permissions:
      id-token: write
      contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Packer
        uses: hashicorp-contrib/setup-packer@f3a1552a94a787a7bbc433141a8f62336f72a61d # v4.0.0
        with:
          packer-version: '1.11.2'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_SELLER }}
          aws-region: eu-west-3

      - name: Build image from template
        run: cd packer; packer init aws-arm-graal.pkr.hcl

      - name: Build image from template
        run: ./build-aws-arm-graal.sh --java-major 25 --java-version 25.0.4 --graalvm-version 25.2.4 --graalvm-jdk-version 25i2 --copy-regions true --profile default --latest true
