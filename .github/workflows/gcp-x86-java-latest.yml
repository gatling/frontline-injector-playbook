name: GCP x86 java latest
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install `ansible bundle`
        run: pip install ansible jmespath

      - name: Setup `packer`
        uses: hashicorp/setup-packer@97ec7008e79c4247af034e505b489f47f01173a6 # main
        with:
          version: "latest"

      - name: Install `packer plugins - GCP`
        run: packer plugins install github.com/hashicorp/googlecompute

      - name: Install `packer plugins - Ansible`
        run: packer plugins install github.com/hashicorp/ansible

      - name: Configure GCP Credentials
        run: |
          echo $ENV_FILE > creds.json;
        shell: bash
        env: 
          ENV_FILE: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }} 

      - name: Build image from template
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./creds.json"
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        run: |
          ./build-gcp-x86-zulu.sh \
            --java-major 27 \
            --project-id "$GOOGLE_PROJECT_ID" \
            --latest true
