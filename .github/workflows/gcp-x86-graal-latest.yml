name: GCP x86 graalvm latest
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Packer
        uses: hashicorp-contrib/setup-packer@f3a1552a94a787a7bbc433141a8f62336f72a61d # v4.0.0
        with:
            packer-version: '1.11.2'

      - name: Build image from template
        run: cd packer; packer init gcp-x86-graal.pkr.hcl

      - name: Configure GCP Credentials
        run: |
          echo "$ENV_FILE" > creds.json;
        shell: bash
        env: 
          ENV_FILE: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }} 

      - name: Build image from template
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./creds.json"
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        run: |
          ./build-gcp-x86-graal.sh --java-major 25 --java-version 25.0.4 --graalvm-version 25.2.4 --graalvm-jdk-version 25i2 --project-id "$GOOGLE_PROJECT_ID" --latest true
